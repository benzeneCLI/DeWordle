# docker-compose.redis.yml
# Add to your main docker-compose with: docker compose -f docker-compose.yml -f docker-compose.redis.yml up

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: dewordle_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: