# infra/nginx/nginx.conf — Nginx config for serving the frontend (Next.js
# `standalone` build) with immutable caching for hashed static assets,
# HTTP/2, and baseline security headers.
#
# Complements infra/nginx/nginx.conf.template (the backend API reverse
# proxy config) — this file focuses on the frontend static-asset serving
# path specifically. Replace {{DOMAIN}} before deploying, same as the
# template.

server {
    listen 80;
    server_name {{DOMAIN}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name {{DOMAIN}};

    ssl_certificate     /etc/ssl/certs/dewordle.crt;
    ssl_certificate_key /etc/ssl/private/dewordle.key;

    root /var/www/dewordle;

    # --- Security headers -----------------------------------------------
    # HSTS: force HTTPS for a year, including subdomains, once a client
    # has seen this header once.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP is intentionally conservative; loosen per-directive only as
    # specific third-party assets (fonts, wallet extension bridges, etc.)
    # actually require it, rather than starting permissive.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # --- Next.js hashed static assets: cache forever, immutably ---------
    # Next.js content-hashes every file under _next/static/ (the filename
    # itself changes on any content change), so it's always safe to tell
    # browsers/CDNs to cache these for the maximum allowed duration and
    # never revalidate.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static assets under /public (favicon, images, etc.) aren't
    # content-hashed, so they get a shorter, revalidatable cache instead
    # of "immutable" — a deployed change to one of these should become
    # visible within an hour, not a year.
    location /static/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # HTML documents and everything else: no long-lived caching, since
    # Next.js pages can change on every deploy and we want clients to
    # always revalidate.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
